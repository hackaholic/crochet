name: sulocraft-test

services:
  test-db:
    image: postgres:17-alpine
    container_name: sulocraft-test-db
    environment:
      POSTGRES_DB: sulocraft_test
      POSTGRES_USER: sulocraft_test
      POSTGRES_PASSWORD: sulocraft_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sulocraft_test -d sulocraft_test"]
      interval: 2s
      timeout: 2s
      retries: 15

  backend:
    build:
      context: ..
      dockerfile: docker/test-backend.Dockerfile
    container_name: sulocraft-test-backend
    environment:
      APP_ENV: test
      TESTING: "true"
      DATABASE_URL: postgresql://sulocraft_test:sulocraft_test@test-db:5432/sulocraft_test
      PYTHONPATH: /app/backend
    volumes:
      - ../backend:/app/backend
      - ../public:/app/public:ro
      - backend-venv:/app/backend/.venv
    working_dir: /app/backend
    depends_on:
      test-db:
        condition: service_healthy
    command: ["uv", "run", "pytest", "tests", "-q"]

  frontend:
    build:
      context: ..
      dockerfile: docker/test-frontend.Dockerfile
    container_name: sulocraft-test-frontend
    volumes:
      - ..:/app
      - frontend-nodemodules:/app/node_modules
    working_dir: /app
    command: ["pnpm", "test"]

  security:
    build:
      context: ..
      dockerfile: docker/test-security.Dockerfile
    container_name: sulocraft-test-security
    environment:
      APP_ENV: test
      TESTING: "true"
      DATABASE_URL: postgresql://sulocraft_test:sulocraft_test@test-db:5432/sulocraft_test
      PYTHONPATH: /app/backend
    volumes:
      - ..:/app
      - backend-venv:/app/backend/.venv
    working_dir: /app
    depends_on:
      test-db:
        condition: service_healthy
    command: ["./scripts/security/scan-sast.sh"]

volumes:
  backend-venv:
  frontend-nodemodules:
