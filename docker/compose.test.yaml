name: sulocraft-test

services:
  test-db:
    image: postgres:17-alpine
    container_name: sulocraft-test-db
    environment:
      POSTGRES_DB: sulocraft_test
      POSTGRES_USER: sulocraft_test
      POSTGRES_PASSWORD: sulocraft_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sulocraft_test -d sulocraft_test"]
      interval: 2s
      timeout: 2s
      retries: 15
