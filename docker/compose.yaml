services:
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8080:5173"
    environment:
      VITE_API_BASE_URL: ""
      VITE_LOCAL_API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      PROJECT_NAME: Sulocraft
      DATABASE_URL: postgresql://sulocraft:sulocraft@db:5432/sulocraft
      FRONTEND_URL: ${LOCAL_FRONTEND_URL:-http://localhost:8080}
      PUBLIC_API_URL: ${LOCAL_PUBLIC_API_URL:-http://localhost:8000}
      ADDITIONAL_CORS_ORIGINS: ${LOCAL_ADDITIONAL_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-/static/images}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      PAYMENT_PROVIDER: mock
      SMS_PROVIDER: mock
      EMAIL_PROVIDER: mock
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sulocraft
      POSTGRES_USER: sulocraft
      POSTGRES_PASSWORD: sulocraft
    ports:
      - "5432:5432"
    volumes:
      - sulocraft-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sulocraft -d sulocraft"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Note: workflow-gui has been migrated to the standalone WorkWeave project (~/git/workweave).
  # Run `TARGET_PATH=/home/anu/git/crochet docker-compose up -d` in ~/git/workweave to start the dashboard on port 8088.

volumes:
  sulocraft-postgres-data:
