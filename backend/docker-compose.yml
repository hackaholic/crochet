services:
  api:
    image: ${API_IMAGE:-sulocraft-api:local}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      TARGET_ENV: ${TARGET_ENV:-preprod}
      PROJECT_NAME: Sulocraft
      DATABASE_URL_FILE: /run/secrets/database_url
      FRONTEND_URL: ${FRONTEND_URL:-}
      ADDITIONAL_CORS_ORIGINS: ${ADDITIONAL_CORS_ORIGINS:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.sulocraft.com}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_ACCESS_KEY_ID_FILE: ${R2_ACCESS_KEY_ID_FILE:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_SECRET_ACCESS_KEY_FILE: ${R2_SECRET_ACCESS_KEY_FILE:-}
      R2_PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET:-sulocraft-products-${TARGET_ENV:-preprod}}
      R2_PRIVATE_BACKUP_BUCKET: ${R2_PRIVATE_BACKUP_BUCKET:-sulocraft-backups-${TARGET_ENV:-preprod}}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-https://images.sulocraft.com}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-https://images.sulocraft.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CLIENT_SECRET_FILE: ${GOOGLE_CLIENT_SECRET_FILE:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_APP_SECRET_FILE: ${FACEBOOK_APP_SECRET_FILE:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-anupama@sulocraft.com}
      ADMIN_NAME: ${ADMIN_NAME:-Anupama Sharma}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY:-}
      FAST2SMS_API_KEY_FILE: ${FAST2SMS_API_KEY_FILE:-}
      FAST2SMS_ROUTE: ${FAST2SMS_ROUTE:-dlt}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_ACCOUNT_SID_FILE: ${TWILIO_ACCOUNT_SID_FILE:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_AUTH_TOKEN_FILE: ${TWILIO_AUTH_TOKEN_FILE:-}
      TWILIO_FROM_PHONE: ${TWILIO_FROM_PHONE:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      EMAIL_FROM_WELCOME: ${EMAIL_FROM_WELCOME:-Sulocraft <welcome@sulocraft.com>}
      EMAIL_FROM_ORDERS: ${EMAIL_FROM_ORDERS:-Sulocraft <orders@sulocraft.com>}
      EMAIL_FROM_SUPPORT: ${EMAIL_FROM_SUPPORT:-Sulocraft Support <support@sulocraft.com>}
      EMAIL_FROM_HELLO: ${EMAIL_FROM_HELLO:-Sulocraft <hello@sulocraft.com>}
      EMAIL_FROM: ${EMAIL_FROM:-Sulocraft <orders@sulocraft.com>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_USER_FILE: ${SMTP_USER_FILE:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_KEY_FILE: ${RESEND_API_KEY_FILE:-}
      EMAIL_SANDBOX_ENABLED: ${EMAIL_SANDBOX_ENABLED:-true}
      EMAIL_ALLOWLIST: ${EMAIL_ALLOWLIST:-@sulocraft.com}
      EMAIL_SANDBOX_REDIRECT: ${EMAIL_SANDBOX_REDIRECT:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_KEY_SECRET_FILE: ${RAZORPAY_KEY_SECRET_FILE:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET_FILE: ${RAZORPAY_WEBHOOK_SECRET_FILE:-}
    secrets:
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      internal:
      gateway:
        aliases:
          - ${API_GATEWAY_ALIAS:-api-${TARGET_ENV:-preprod}}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS_LIMIT:-0.75}"
          memory: ${API_MEM_LIMIT:-768M}
          pids: 150
        reservations:
          cpus: "${API_CPUS_RESERVED:-0.10}"
          memory: ${API_MEM_RESERVED:-128M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB_FILE: /run/secrets/postgres_db
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_db
      - postgres_user
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user 2>/dev/null || echo $$POSTGRES_USER) -d $$(cat /run/secrets/postgres_db 2>/dev/null || echo $$POSTGRES_DB)"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPUS_LIMIT:-0.75}"
          memory: ${POSTGRES_MEM_LIMIT:-1024M}
          pids: 100
        reservations:
          cpus: "${POSTGRES_CPUS_RESERVED:-0.10}"
          memory: ${POSTGRES_MEM_RESERVED:-256M}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

secrets:
  postgres_db:
    file: ${POSTGRES_DB_FILE:?Set POSTGRES_DB_FILE to this target's database secret path}
  postgres_user:
    file: ${POSTGRES_USER_FILE:?Set POSTGRES_USER_FILE to this target's database secret path}
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE to this target's database secret path}
  database_url:
    file: ${DATABASE_URL_FILE:?Set DATABASE_URL_FILE to this target's API database URL secret path}

volumes:
  postgres_data:

networks:
  internal:
  gateway:
    name: ${GATEWAY_NETWORK_NAME:-sulocraft-gateway}
    external: true
