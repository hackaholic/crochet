services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PROJECT_NAME: Sulocraft
      DATABASE_URL: postgresql://${POSTGRES_USER:-sulocraft}:${POSTGRES_PASSWORD:-sulocraft_secure_pw}@postgres:5432/${POSTGRES_DB:-sulocraft}
      FRONTEND_URL: ${FRONTEND_URL:-https://sulocraft.com}
      ADDITIONAL_CORS_ORIGINS: ${ADDITIONAL_CORS_ORIGINS:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.sulocraft.com}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.sulocraft.com}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET:-sulocraft-products}
      R2_PRIVATE_BACKUP_BUCKET: ${R2_PRIVATE_BACKUP_BUCKET:-sulocraft-backups}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-https://images.sulocraft.com}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-https://images.sulocraft.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-anupama@sulocraft.com}
      ADMIN_NAME: ${ADMIN_NAME:-Anupama Sharma}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY:-}
      FAST2SMS_ROUTE: ${FAST2SMS_ROUTE:-dlt}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_PHONE: ${TWILIO_FROM_PHONE:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      EMAIL_FROM_ORDERS: ${EMAIL_FROM_ORDERS:-Sulocraft <orders@sulocraft.com>}
      EMAIL_FROM_SUPPORT: ${EMAIL_FROM_SUPPORT:-Sulocraft Support <support@sulocraft.com>}
      EMAIL_FROM_HELLO: ${EMAIL_FROM_HELLO:-Sulocraft <hello@sulocraft.com>}
      EMAIL_FROM: ${EMAIL_FROM:-Sulocraft <orders@sulocraft.com>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sulocraft}
      POSTGRES_USER: ${POSTGRES_USER:-sulocraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sulocraft_secure_pw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sulocraft} -d ${POSTGRES_DB:-sulocraft}"]
      interval: 10s
      timeout: 5s
      retries: 5

  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
