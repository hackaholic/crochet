name: Deploy development backend

on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "docker/**"
      - "secrets/encrypted/**"
      - ".github/workflows/deploy-dev-backend.yml"
  workflow_dispatch:

concurrency:
  group: sulocraft-development-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: uv sync --extra dev --frozen

      - name: Run backend tests
        run: uv run pytest tests -q

  deploy:
    name: Deploy to VPS Preprod
    needs: test
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${VPS_KNOWN_HOSTS:-}" ]; then
            echo "::error::Missing VPS_SSH_PRIVATE_KEY or VPS_KNOWN_HOSTS in repository secrets."
            echo "Please set up these secrets in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy isolated preprod release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ]; then
            echo "::error::Missing VPS_HOST or VPS_USER in repository secrets."
            echo "Please set up these secrets in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          DEPLOY_HOST="${VPS_USER}@${VPS_HOST}"
          export DEPLOY_HOST
          export RELEASE_ID="${RELEASE_ID:0:12}"
          backend/scripts/deploy_vps.sh --env preprod --host "${DEPLOY_HOST}"

      - name: Verify preprod API health
        run: |
          echo "Verifying preprod API health..."
          for i in $(seq 1 15); do
            if curl -sSf https://api-dev.sulocraft.com/health 2>/dev/null | grep -q '"status":"ok"'; then
              echo "Preprod API health check succeeded at https://api-dev.sulocraft.com/health"
              exit 0
            fi
            echo "Waiting for preprod route / DNS propagation (attempt $i/15)..."
            sleep 4
          done
          echo "Public route check timed out. Note: VPS internal deployment passed; DNS/Cloudflare route activation belongs to cutover."
