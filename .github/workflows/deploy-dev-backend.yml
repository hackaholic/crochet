name: Deploy development backend

on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "docker/**"
      - ".github/workflows/deploy-dev-backend.yml"
  workflow_dispatch:

concurrency:
  group: sulocraft-development-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install backend dependencies
        run: uv sync --extra dev --frozen
      - name: Run backend tests
        run: uv run pytest tests -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Create protected deployment environment
        env:
          PREPROD_ENV_FILE: ${{ secrets.PREPROD_ENV_FILE }}
        run: |
          printf '%s\n' "$PREPROD_ENV_FILE" > backend/.env.preprod
          chmod 600 backend/.env.preprod
      - name: Deploy health-checked release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          DEPLOY_HOST="${VPS_USER}@${VPS_HOST}" \
          DEPLOY_ENV_FILE=backend/.env.preprod \
          RELEASE_ID="${RELEASE_ID:0:12}" \
          backend/scripts/deploy_vps.sh
