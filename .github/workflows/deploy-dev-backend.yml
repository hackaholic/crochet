name: Deploy development backend

on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "docker/**"
      - "deploy/**"
      - "deploy_vps.sh"
      - "scripts/deploy*"
      - "secrets/encrypted/**"
      - ".github/workflows/deploy-dev-backend.yml"
  workflow_dispatch:

concurrency:
  group: sulocraft-development-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: uv sync --extra dev --frozen

      - name: Run backend tests
        run: uv run pytest tests -q

  deploy:
    name: Deploy to VPS Preprod
    needs: test
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment prerequisites
        run: |
          uv sync --project backend --extra dev --frozen
          docker compose version
          # Shared local validation expects the docker-compose command.
          mkdir -p "$HOME/.local/bin"
          printf '#!/usr/bin/env bash\nexec docker compose "$@"\n' > "$HOME/.local/bin/docker-compose"
          chmod 700 "$HOME/.local/bin/docker-compose"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "SULOCRAFT_PYTHON=$GITHUB_WORKSPACE/backend/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${VPS_KNOWN_HOSTS:-}" ]; then
            echo "::error::Missing VPS_SSH_PRIVATE_KEY or VPS_KNOWN_HOSTS in repository secrets."
            echo "Please set up these secrets in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy isolated preprod release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ]; then
            echo "::error::Missing VPS_HOST or VPS_USER in repository secrets."
            echo "Please set up these secrets in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          "$SULOCRAFT_PYTHON" scripts/deploy_ci.py configure --env preprod --config .deploy/vps-config.yaml
          bash ./deploy_vps.sh --env preprod --config .deploy/vps-config.yaml

      - name: Verify preprod API health
        run: '"$SULOCRAFT_PYTHON" scripts/deploy_ci.py health --env preprod --config .deploy/vps-config.yaml'
