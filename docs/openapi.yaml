  /api/v1/seo/snapshot:
    get:
      tags:
      - seo
      summary: Get Content Snapshot
      description: Get paginated build snapshot containing fully resolved metadata
        and structured data for static pre-rendering.
      operationId: get_content_snapshot_api_v1_seo_snapshot_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number for snapshot pagination
          default: 1
          title: Page
        description: Page number for snapshot pagination
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Items per page
          default: 50
          title: Limit
        description: Items per page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeoSnapshotResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
