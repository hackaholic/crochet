openapi: 3.1.0
info:
  title: Sulocraft API
  description: Backend service for the Sulocraft direct-to-consumer crochet storefront.
  version: 0.2.0
paths:
  /api/v1/categories:
    get:
      tags:
      - catalogue
      summary: Get Categories
      description: Retrieve all categories conforming to product-taxonomy spec.
      operationId: get_categories_api_v1_categories_get
      parameters:
      - name: flat
        in: query
        required: false
        schema:
          type: boolean
          description: Return flat list instead of hierarchical tree
          default: false
          title: Flat
        description: Return flat list instead of hierarchical tree
      - name: includeEmpty
        in: query
        required: false
        schema:
          type: boolean
          description: Include empty categories
          default: false
          title: Includeempty
        description: Include empty categories
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryOut'
                title: Response Get Categories Api V1 Categories Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/categories/{slug}:
    get:
      tags:
      - catalogue
      summary: Get Category By Slug
      description: Retrieve a single category by its slug with accurate descendant
        product count.
      operationId: get_category_by_slug_api_v1_categories__slug__get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/categories/{slug}/products:
    get:
      tags:
      - catalogue
      summary: Get Category Products
      description: Retrieve all products under a category (including subcategories)
        deduplicated.
      operationId: get_category_products_api_v1_categories__slug__products_get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: featured
          title: Sort
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductListItem'
                title: Response Get Category Products Api V1 Categories  Slug  Products
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/collections:
    get:
      tags:
      - catalogue
      summary: Get Collections
      description: Retrieve active and currently scheduled collections ordered by
        display_order.
      operationId: get_collections_api_v1_collections_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CollectionOut'
                type: array
                title: Response Get Collections Api V1 Collections Get
  /api/v1/collections/{slug}:
    get:
      tags:
      - catalogue
      summary: Get Collection By Slug
      description: Retrieve a single active scheduled collection by slug.
      operationId: get_collection_by_slug_api_v1_collections__slug__get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/collections/{slug}/products:
    get:
      tags:
      - catalogue
      summary: Get Collection Products
      description: Retrieve all active products in a collection ordered by assignment
        display_order.
      operationId: get_collection_products_api_v1_collections__slug__products_get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: featured
          title: Sort
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductListItem'
                title: Response Get Collection Products Api V1 Collections  Slug  Products
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/products:
    get:
      tags:
      - catalogue
      summary: List Products
      description: Search and filter the product catalogue with pagination and sorting.
      operationId: list_products_api_v1_products_get
      parameters:
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by category slug or name
          title: Category
        description: Filter by category slug or name
      - name: collection
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by collection slug or name
          title: Collection
        description: Filter by collection slug or name
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by tag name (e.g. romantic, birthday)
          title: Tag
        description: Filter by tag name (e.g. romantic, birthday)
      - name: occasion
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Alias for occasion/tag filtering
          title: Occasion
        description: Alias for occasion/tag filtering
      - name: color
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by color attribute in variants
          title: Color
        description: Filter by color attribute in variants
      - name: customizable
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter customizable products
          title: Customizable
        description: Filter customizable products
      - name: min_price
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          description: Minimum price in INR
          title: Min Price
        description: Minimum price in INR
      - name: max_price
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          description: Maximum price in INR
          title: Max Price
        description: Maximum price in INR
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search keyword in name or description
          title: Search
        description: Search keyword in name or description
      - name: badge
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by badge (e.g. Bestseller, New, Limited)
          title: Badge
        description: Filter by badge (e.g. Bestseller, New, Limited)
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: 'Sorting: featured, price_asc, price_desc, rating, newest,
            best_selling'
          default: featured
          title: Sort
        description: 'Sorting: featured, price_asc, price_desc, rating, newest, best_selling'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-indexed)
          default: 1
          title: Page
        description: Page number (1-indexed)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page
          default: 50
          title: Limit
        description: Items per page
      - name: offset
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          description: Manual offset; overrides page if provided
          title: Offset
        description: Manual offset; overrides page if provided
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductListItem'
                title: Response List Products Api V1 Products Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/products/search:
    get:
      tags:
      - catalogue
      summary: Search Products
      description: Search products across name, description, tags, and category names.
      operationId: search_products_api_v1_products_search_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          description: Search keyword
          title: Q
        description: Search keyword
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductListItem'
                title: Response Search Products Api V1 Products Search Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/products/{slug_or_id}:
    get:
      tags:
      - catalogue
      summary: Get Product Detail
      description: Retrieve full product details conforming to Section 2 of Specification.
      operationId: get_product_detail_api_v1_products__slug_or_id__get
      parameters:
      - name: slug_or_id
        in: path
        required: true
        schema:
          type: string
          title: Slug Or Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/occasions:
    get:
      tags:
      - catalogue
      summary: Get Occasions
      description: Retrieve curated gift occasions that are enabled and in season.
      operationId: get_occasions_api_v1_occasions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OccasionOut'
                type: array
                title: Response Get Occasions Api V1 Occasions Get
  /api/v1/reviews:
    get:
      tags:
      - catalogue
      summary: Get Reviews
      description: Retrieve customer testimonials and reviews for homepage and storefront.
      operationId: get_reviews_api_v1_reviews_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewOut'
                title: Response Get Reviews Api V1 Reviews Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/products/{slug_or_id}/reviews:
    post:
      tags:
      - catalogue
      summary: Submit Product Review
      description: Submit a verified customer review for a product and recalculate
        product ratings.
      operationId: submit_product_review_api_v1_products__slug_or_id__reviews_post
      parameters:
      - name: slug_or_id
        in: path
        required: true
        schema:
          type: string
          title: Slug Or Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: x-session-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Session-Token
      - name: session_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cart:
    get:
      tags:
      - cart
      summary: Get Cart
      description: Retrieve current shopping cart. Returns empty cart representation
        if no cart exists.
      operationId: get_cart_api_v1_cart_get
      parameters:
      - name: x-cart-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Cart-Token
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: x-session-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Session-Token
      - name: guest_cart_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Guest Cart Token
      - name: session_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - cart
      summary: Clear Cart
      description: Clear all items from the current cart.
      operationId: clear_cart_api_v1_cart_delete
      parameters:
      - name: x-cart-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Cart-Token
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: x-session-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Session-Token
      - name: guest_cart_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Guest Cart Token
      - name: session_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cart/items:
    post:
      tags:
      - cart
      summary: Add Cart Item
      description: Add a product or variant to the cart with quantity and optional
        personalization.
      operationId: add_cart_item_api_v1_cart_items_post
      parameters:
      - name: x-cart-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Cart-Token
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: x-session-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Session-Token
      - name: guest_cart_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Guest Cart Token
      - name: session_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemAdd'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cart/items/{item_id}:
    patch:
      tags:
      - cart
      summary: Update Cart Item
      description: Update quantity or personalization for a specific line item in
        the cart.
      operationId: update_cart_item_api_v1_cart_items__item_id__patch
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          title: Item Id
      - name: x-cart-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Cart-Token
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: x-session-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Session-Token
      - name: guest_cart_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Guest Cart Token
      - name: session_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - cart
      summary: Delete Cart Item
      description: Remove a specific line item from the cart.
      operationId: delete_cart_item_api_v1_cart_items__item_id__delete
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          title: Item Id
      - name: x-cart-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Cart-Token
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: x-session-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Session-Token
      - name: guest_cart_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Guest Cart Token
      - name: session_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cart/merge:
    post:
      tags:
      - cart
      summary: Merge Guest Cart
      description: Merge an anonymous guest cart into the active session cart conforming
        to Section 6 of Spec.
      operationId: merge_guest_cart_api_v1_cart_merge_post
      parameters:
      - name: x-cart-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Cart-Token
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: x-session-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Session-Token
      - name: guest_cart_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Guest Cart Token
      - name: session_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartMergeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cart/apply-coupon:
    post:
      tags:
      - cart
      summary: Apply Coupon
      description: Validate and apply promo coupon to active cart.
      operationId: apply_coupon_api_v1_cart_apply_coupon_post
      parameters:
      - name: x-cart-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Cart-Token
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: x-session-token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Session-Token
      - name: guest_cart_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Guest Cart Token
      - name: session_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponApplyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponApplyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cart/coupon:
    delete:
      tags:
      - cart
      summary: Remove Coupon
      description: Remove coupon from cart session.
      operationId: remove_coupon_api_v1_cart_coupon_delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
