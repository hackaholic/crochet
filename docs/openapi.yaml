  /api/v1/seo/resolve:
    get:
      tags:
      - seo
      summary: Resolve Seo Metadata
      description: Resolve dynamic SEO metadata (title, description, canonical, robots,
        og:image, breadcrumbs) for any storefront path.
      operationId: resolve_seo_metadata_api_v1_seo_resolve_get
      parameters:
      - name: path
        in: query
        required: false
        schema:
          type: string
          description: Relative pathname or full URL to resolve metadata for
          default: /
          title: Path
        description: Relative pathname or full URL to resolve metadata for
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeoMetadataOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/seo/routes:
